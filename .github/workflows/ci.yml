name: Verificar aplicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y probar reglas, permisos y persistencia
        run: ./mvnw -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revisar JavaScript
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/cuenta.js
          node --check src/main/resources/static/icons.js
          node --check src/main/resources/static/mascot.js
      - name: Instalar navegador para pruebas
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Probar interfaz en escritorio y celular
        run: python tests/browser_smoke.py
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-aplicacion
          path: |
            test-results/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  contenedor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir contenedor
        run: docker build -t cuenta-clara:test .
      - name: Comprobar arranque y persistencia
        run: |
          docker run -d --name cuenta-clara-ci -p 8000:8000 -v cuenta-clara-test:/data -e ADMIN_PASSWORD=PruebaSegura2026 cuenta-clara:test
          python tests/container_smoke.py
      - name: Mostrar registro del contenedor
        if: always()
        run: docker logs cuenta-clara-ci
